# Radeski CRM — production (and local) stack.
# Server rules (shared host, 23 projects): see docs/04_DEPLOY.md
#   - only `web` publishes a port, bound to 127.0.0.1 (host nginx proxies to it)
#   - db / redis publish NO ports
#   - every service has its own log rotation
#   - volume names carry the project prefix
name: radeski-crm

x-logging: &logging
  driver: "json-file"
  options: { max-size: "20m", max-file: "5" }

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://crm:${DB_PASSWORD:?DB_PASSWORD kerak}@db:5432/crm
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *logging

services:
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-9250}:80"
    depends_on:
      - api
    logging: *logging

  api:
    <<: *backend
    volumes:
      - radeski_crm_recordings:/recordings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:${DB_PASSWORD:?DB_PASSWORD kerak}@db:5432/crm
      REDIS_URL: redis://redis:6379/0
      DB_NULL_POOL: "true"
    volumes:
      - radeski_crm_recordings:/recordings
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "celery", "--loglevel=INFO", "--concurrency=2"]

  # AI analyses wait on OpenAI (the flex tier can take minutes), so they get their own worker:
  # messages, reminders and recordings never queue behind them
  worker-ai:
    <<: *backend
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:${DB_PASSWORD:?DB_PASSWORD kerak}@db:5432/crm
      REDIS_URL: redis://redis:6379/0
      DB_NULL_POOL: "true"
    volumes:
      - radeski_crm_recordings:/recordings
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "ai", "-n", "ai@%h", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *backend
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:${DB_PASSWORD:?DB_PASSWORD kerak}@db:5432/crm
      REDIS_URL: redis://redis:6379/0
      DB_NULL_POOL: "true"
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD kerak}
      TZ: Asia/Tashkent
    volumes:
      - radeski_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - radeski_crm_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # Asterisk. Started only with `--profile telephony` once .env has the PBX_*/SIP_* values
  # (docs/06_TELEFONIYA.md). SIP and RTP must be reachable from Uztelecom and the operators'
  # browsers, so these UDP ports are published on all interfaces; its HTTP/WebSocket port is
  # internal and reached through web (/ws).
  pbx:
    build: ./telephony
    profiles: ["telephony"]
    restart: unless-stopped
    env_file: .env
    environment:
      PBX_CRM_URL: http://web
    ports:
      - "${PBX_SIP_PORT:-5060}:${PBX_SIP_PORT:-5060}/udp"
      - "${PBX_RTP_START:-17000}-${PBX_RTP_END:-17039}:${PBX_RTP_START:-17000}-${PBX_RTP_END:-17039}/udp"
    volumes:
      - radeski_crm_recordings:/var/spool/asterisk/recordings
      - radeski_crm_pbx_sounds:/opt/radeski/sounds-custom
    logging: *logging

volumes:
  radeski_crm_pgdata:
  radeski_crm_redisdata:
  radeski_crm_recordings:
  radeski_crm_pbx_sounds:
