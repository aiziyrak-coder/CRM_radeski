# Included by nginx.conf in every location that sets its own headers.
# CSP: everything is served from this origin; the softphone's WebSocket (/ws) is same-origin,
# recordings play from blob: URLs, the 2FA QR code is an inline image.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
