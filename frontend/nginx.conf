# In-container nginx: serves the SPA and proxies /api to the backend.
# Host nginx (shared, TLS) forwards crm.radeski.uz -> 127.0.0.1:9250 -> here.
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Re-resolve `api` via Docker DNS so recreating the api container
    # (docker compose up -d --no-deps api) doesn't leave a stale IP -> 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # WebSocket (call popups, live task updates)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
    }

    # SIP over WebSocket for the operators' softphones (Asterisk http.conf). The pbx service
    # only runs with the `telephony` profile; until then this answers 502.
    location = /ws {
        set $pbx_upstream http://pbx:8088;
        proxy_pass $pbx_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
