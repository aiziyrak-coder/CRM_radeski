; Radeski PBX dialplan.
; Every call ends with a POST to the CRM (/api/telephony/events) from a hangup handler, so the
; call log, missed-call tasks and recordings don't depend on a long-lived ARI/AMI connection.

[general]
static=yes
writeprotect=yes

[globals]
CRM_EVENTS=@@PBX_CRM_URL@@/api/telephony/events
CRM_SECRET=@@PBX_API_SECRET@@
TRUNK_NUMBER=@@SIP_NUMBER@@
DIAL_PREFIX=@@SIP_DIAL_PREFIX@@
REC_DIR=/var/spool/asterisk/recordings
QUEUE_WAIT=@@PBX_QUEUE_WAIT@@

; --- helpers -----------------------------------------------------------------------------------

[crm]
; ARG1: url-encoded form body
exten => event,1,Set(CURLOPT(httpheader)=X-PBX-Secret: ${CRM_SECRET})
 same => n,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(CRM_REPLY=${CURL(${CRM_EVENTS},${ARG1})})
 ; the hangup report is retried once when the CRM didn't answer (empty reply: restart, network
 ; blip). Safe: a report that did arrive twice is ignored. Not for "ring": the caller would wait.
 same => n,GotoIf($["${CRM_REPLY}" != ""]?done)
 same => n,GotoIf($["${ARG1:0:8}" != "kind=end"]?done)
 same => n,Set(CRM_REPLY=${CURL(${CRM_EVENTS},${ARG1})})
 same => n(done),Return()

; --- inbound (Uztelecom) -----------------------------------------------------------------------

[from-trunk]
exten => _X.,1,Goto(inbound,s,1)
exten => _+X.,1,Goto(inbound,s,1)
exten => s,1,Goto(inbound,s,1)

[inbound]
exten => s,1,Set(CALL_ID=${UNIQUEID})
 same => n,Set(CALL_START=${EPOCH})
 same => n,Set(RESULT=abandoned)
 same => n,Set(CALLBACK=0)
 same => n,Set(CHANNEL(hangup_handler_push)=hangup-inbound,s,1)
 same => n,Gosub(crm,event,1(kind=ring&call_id=${CALL_ID}&caller=${URIENCODE(${CALLERID(num)})}))
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,GotoIfTime(@@PBX_OPEN_HOURS@@,@@PBX_OPEN_DAYS@@,*,*,Asia/Tashkent?open)
 same => n,Set(RESULT=after_hours)
 same => n,Playback(radeski/after-hours)
 same => n,Goto(offer)
 ; "Radeski Skin Clinic, suhbat sifat nazorati uchun yozib olinadi"
 same => n(open),Playback(radeski/welcome)
 ; record only while talking to an operator: r = caller (patient), t = operator
 same => n,MixMonitor(${REC_DIR}/${CALL_ID}-mix.wav,br(${REC_DIR}/${CALL_ID}-in.wav)t(${REC_DIR}/${CALL_ID}-out.wav))
 same => n,Set(QUEUE_START=${EPOCH})
 same => n,Queue(operators,t,,,${QUEUE_WAIT})
 same => n,Set(RESULT=missed)
 same => n(offer),Read(DIGIT,radeski/press-1-callback,1,,2,6)
 same => n,GotoIf($["${DIGIT}" = "1"]?callback,1)
 same => n,Playback(radeski/goodbye)
 same => n,Hangup()

exten => callback,1,Set(CALLBACK=1)
 same => n,Playback(radeski/callback-ok)
 same => n,Hangup()

; pressing 1 while waiting in the queue
[queue-exit]
exten => 1,1,Set(RESULT=missed)
 same => n,Goto(inbound,callback,1)

[hangup-inbound]
exten => s,1,Set(AGENT=${CUT(MEMBERINTERFACE,/,2)})
 same => n,Set(STATUS=${RESULT})
 same => n,Set(TALK=0)
 same => n,GotoIf($["${AGENT}" = ""]?report)
 same => n,Set(STATUS=answered)
 same => n,Set(TALK=$[${EPOCH} - ${QUEUE_START} - ${QEHOLDTIME}])
 same => n(report),Gosub(crm,event,1(kind=end&direction=in&call_id=${CALL_ID}&caller=${URIENCODE(${CALLERID(num)})}&status=${STATUS}&agent=${AGENT}&started=${CALL_START}&ended=${EPOCH}&wait=${QEHOLDTIME}&talk=${TALK}&callback=${CALLBACK}))
 same => n,Return()

; --- operators (WebRTC softphones) -------------------------------------------------------------

[from-operators]
; echo test: works without the trunk, checks microphone, headset and NAT
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()
; operator to operator
exten => _1XX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
; Uzbek numbers only (no international dialling from the softphones)
exten => _XXXXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _998XXXXXXXXX,1,Goto(outbound,${EXTEN:3},1)
exten => _+998XXXXXXXXX,1,Goto(outbound,${EXTEN:4},1)
exten => _8XXXXXXXXX,1,Goto(outbound,${EXTEN:1},1)
exten => i,1,Hangup(1)

[outbound]
exten => _XXXXXXXXX,1,Set(CALL_ID=${UNIQUEID})
 same => n,Set(CALL_START=${EPOCH})
 same => n,Set(NUMBER=${EXTEN})
 same => n,Set(AGENT=${CALLERID(num)})
 ; set by the CRM softphone when the call is made from a task
 same => n,Set(TASK=${PJSIP_HEADER(read,X-CRM-Task)})
 same => n,Set(CHANNEL(hangup_handler_push)=hangup-outbound,s,1)
 ; on the operator's channel r = operator, t = patient
 same => n,MixMonitor(${REC_DIR}/${CALL_ID}-mix.wav,br(${REC_DIR}/${CALL_ID}-out.wav)t(${REC_DIR}/${CALL_ID}-in.wav))
 same => n,Set(CALLERID(all)=<${TRUNK_NUMBER}>)
 same => n,Dial(PJSIP/${DIAL_PREFIX}${EXTEN}@uztelecom,60)
 same => n,Hangup()

[hangup-outbound]
exten => s,1,Gosub(crm,event,1(kind=end&direction=out&call_id=${CALL_ID}&caller=${NUMBER}&status=${TOLOWER(${DIALSTATUS})}&agent=${AGENT}&started=${CALL_START}&ended=${EPOCH}&wait=0&talk=${IF($["${ANSWEREDTIME}" != ""]?${ANSWEREDTIME}:0)}&task=${TASK}))
 same => n,Return()

; --- testing -----------------------------------------------------------------------------------
; Not reachable from any endpoint; used from the Asterisk CLI to simulate an inbound call:
;   channel originate Local/900002244@test-inbound application Wait 20
[test-inbound]
exten => _X.,1,Set(CALLERID(num)=${EXTEN})
 same => n,Goto(inbound,s,1)

; A fake operator that answers and talks, for testing the answered path without a headset:
;   queue add member Local/answer@test-agent/n to operators
[test-agent]
exten => answer,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()
