; Uztelecom SIP trunk (registration-based). A ';' in the password would start a comment here.
[uztelecom]
type=registration
transport=transport-udp
outbound_auth=uztelecom
server_uri=sip:@@SIP_HOST@@:@@SIP_PORT@@
client_uri=sip:@@SIP_USERNAME@@@@@SIP_HOST@@:@@SIP_PORT@@
contact_user=@@SIP_USERNAME@@
retry_interval=60
forbidden_retry_interval=600
expiration=300
line=yes
endpoint=uztelecom

[uztelecom]
type=auth
auth_type=userpass
username=@@SIP_USERNAME@@
password=@@SIP_PASSWORD@@

[uztelecom]
type=aor
contact=sip:@@SIP_HOST@@:@@SIP_PORT@@
qualify_frequency=60

[uztelecom]
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=alaw,ulaw
outbound_auth=uztelecom
aors=uztelecom
from_user=@@SIP_USERNAME@@
from_domain=@@SIP_HOST@@
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=auto

[uztelecom]
type=identify
endpoint=uztelecom
match=@@SIP_HOST@@
