[global]
type=global
user_agent=Radeski PBX
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:@@PBX_SIP_PORT@@
#include pjsip_nat.conf

; WebRTC softphones connect over the HTTP server (http.conf) at /ws
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

#include pjsip_operators.conf
#include pjsip_trunk.conf
