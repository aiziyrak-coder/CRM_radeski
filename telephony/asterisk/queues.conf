[general]
persistentmembers=no
shared_lastcall=yes

; One operator at a time (shifts). A second caller waits with music and is reminded every
; 30 s that pressing 1 leaves the queue and books a callback.
[operators]
strategy=ringall
timeout=25
retry=2
wrapuptime=10
maxlen=5
musicclass=default
ringinuse=no
joinempty=unavailable,invalid,unknown
leavewhenempty=unavailable,invalid,unknown
periodic-announce=radeski/press-1-callback
periodic-announce-frequency=30
announce-holdtime=no
context=queue-exit
setinterfacevar=yes
setqueueentryvar=yes
#include queue_members.conf
